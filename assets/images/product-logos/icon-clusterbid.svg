<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="ClusterBid mark">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #242424; }
    .accent { fill: #ff8b53; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; }
      .ink { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <g transform="translate(4, 7)">
    <rect class="ink" x="0"  y="0"  width="5" height="5"/>
    <rect class="ink" x="6"  y="0"  width="5" height="5"/>
    <rect class="ink" x="12" y="0"  width="5" height="5"/>
    <rect class="accent" x="18" y="0"  width="5" height="5"/>
    <rect class="ink" x="0"  y="6"  width="5" height="5"/>
    <rect class="ink" x="6"  y="6"  width="5" height="5"/>
    <rect class="ink" x="12" y="6"  width="5" height="5" opacity="0.85"/>
    <rect class="accent" x="18" y="6"  width="5" height="5"/>
    <rect class="ink" x="0"  y="12" width="5" height="5"/>
    <rect class="ink" x="6"  y="12" width="5" height="5"/>
    <rect class="ink" x="12" y="12" width="5" height="5"/>
  </g>
</svg>
